[package]
name = "abstract-editor"
version = "0.1.0"
edition = "2024"
description = "Minimal local-first markdown notes editor, GPU-rendered with GPUI"
repository = "https://github.com/horizzon3507/abstract-editor"
license = "Apache-2.0"
rust-version = "1.97"
keywords = ["markdown", "notes", "editor", "gpui"]
categories = ["text-editors"]
readme = "README.md"

[dependencies]
gpui = { version = "=0.3.4", package = "gpui-pre" }
gpui-base = "=0.6.1"
gpui-component = "=0.6.1"
gpui-component-macros = "=0.6.1"
gpui-kit = { version = "=0.6.1", default-features = false, features = ["component", "tree-sitter-markdown", "tree-sitter-markdown-inline"] }
gpui-kit-assets = "=0.6.1"
gpui_platform = { version = "=0.3.4", package = "gpui-pre-platform", default-features = false, features = ["wayland", "x11"] }
tree-sitter = "=0.26.13"
tree-sitter-md = "=0.5.3"
trash = "5"
unicode-segmentation = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
