[package]
name = "leadown"
version = "0.1.1"
edition = "2024"
description = "Minimal local-first markdown notes editor"
repository = "https://github.com/fireflylabss/leadown"
license = "Apache-2.0"
rust-version = "1.97"
keywords = ["markdown", "notes", "editor", "local-first"]
categories = ["text-editors"]
readme = "README.md"

[[bin]]
name = "leadown"
path = "src/main.rs"

[dependencies]
tauri = { version = "2" }
notify = "8"
sys-locale = "0.3"
futures = "0.3"
trash = "5"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.12"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
