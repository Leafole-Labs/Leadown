<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadown</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Titlebar -->
        <div id="titlebar">
            <div class="titlebar-left">
                <button id="btn-sidebar" class="icon-btn" title="Sidebar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                </button>
                <button id="btn-search" class="icon-btn" title="Search">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
            </div>
            <div class="titlebar-center" id="titlebar-title">Leadown</div>
            <div class="titlebar-right">
                <button id="btn-theme" class="icon-btn" title="Theme">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
                <button id="btn-delete" class="icon-btn danger hidden" title="Delete note">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,6 5,6 21,6"/><path d="M19,6v14a2,2,0,0,1-2,2H7a2,2,0,0,1-2-2V6m3,0V4a2,2,0,0,1,2-2h4a2,2,0,0,1,2,2v2"/></svg>
                </button>
                <div class="window-controls" id="window-controls">
                    <button class="win-btn" id="win-min" title="Minimize" data-tauri-drag-region>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <button class="win-btn" id="win-max" title="Maximize" data-tauri-drag-region>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
                    </button>
                    <button class="win-btn win-close" id="win-close" title="Close" data-tauri-drag-region>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Main content -->
        <div id="main">
            <!-- Sidebar -->
            <div id="sidebar">
                <div class="sidebar-header">
                    <button id="btn-spaces" class="sidebar-btn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                        <span>Spaces</span>
                    </button>
                </div>
                <div class="sidebar-actions">
                    <button id="btn-new-note" class="sidebar-btn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                        <span>New Note</span>
                    </button>
                    <button id="btn-new-folder" class="sidebar-btn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
                        <span>New Folder</span>
                    </button>
                </div>
                <div id="note-tree" class="note-tree"></div>
            </div>

            <!-- Editor area -->
            <div id="editor-area">
                <div id="toolbar">
                    <span id="word-count">0 words</span>
                    <span id="save-status"></span>
                </div>
                <div id="editor-container">
                    <div id="markdown-preview" class="markdown-body"></div>
                    <textarea id="editor" placeholder="Start writing..." spellcheck="false"></textarea>
                    <div id="empty-state" class="empty-state">
                        <div class="empty-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
                        </div>
                        <div class="empty-text">Select a note or create a new one</div>
                        <button id="btn-empty-new" class="btn-primary">New Note</button>
                    </div>
                </div>
                <div id="backlinks" class="hidden">
                    <h3>Referenced by</h3>
                    <ul id="backlink-list"></ul>
                </div>
            </div>
        </div>

        <!-- Search palette -->
        <div id="search-palette" class="overlay hidden">
            <div class="palette">
                <input type="text" id="search-input" placeholder="Search notes...">
                <div id="search-results"></div>
            </div>
        </div>

        <!-- Tour -->
        <div id="tour-overlay" class="overlay hidden">
            <div id="tour-bubble" class="tour-bubble">
                <h3 id="tour-title"></h3>
                <p id="tour-body"></p>
                <div class="tour-actions">
                    <span id="tour-step"></span>
                    <button id="tour-skip" class="tour-btn">Skip</button>
                    <button id="tour-back" class="tour-btn hidden">Back</button>
                    <button id="tour-next" class="tour-btn primary">Next</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
